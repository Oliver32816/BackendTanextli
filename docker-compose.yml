services:
  db:
    image: postgres:15-alpine
    container_name: tanextli_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tanextli_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  app:
    build: .
    container_name: tanextli_backend
    ports:
      - "3000:3001"
    environment:
      - PORT=3001
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=tanextli_db
      - DB_PORT=5432
      - JWT_SECRET=tanextli_secret_key_2026
    volumes:
      - .:/app
      - /home/olo/tanextli-project/Multimedia/AudiosTanextli:/home/olo/tanextli-project/Multimedia/AudiosTanextli
    depends_on:
      - db
    restart: always

volumes:
  postgres_data:
